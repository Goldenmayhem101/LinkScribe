<!doctype html><meta charset="utf-8"><body><script>

(()=>{
"use strict";
// ---------- palette (5 cores, tonal variants derived) ----------
let P={ink:[16,19,40],dusk:[96,66,128],moss:[46,128,120],moon:[222,242,255],ember:[255,176,90]};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const tone=(c,k)=>k<0?mix(c,P.ink,-k):mix(c,P.moon,k);
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);


const LW=400; let LH=800, S=1, GY=560, FW=400;

function layer(w,h,s){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*s));c.height=Math.max(1,Math.ceil(h*s));const g=c.getContext('2d');g.setTransform(s,0,0,s,0,0);return{c,g,w,h,s};}
function radial(g,x,y,r,c,a0,a1=0){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(c,a0));gr.addColorStop(1,rgba(c,a1));return gr;}
// rim light: stroke a shifted copy of the outline inside the shape's clip
function rim(g,path,dx,dy,col,w){g.save();path(g);g.clip();g.translate(dx,dy);path(g);g.lineWidth=w;g.strokeStyle=col;g.stroke();g.restore();}
function bumpy(g,x,y,r,R,n=12,j=.22){g.beginPath();const o=R()*TAU;for(let i=0;i<=n;i++){const a=o+i/n*TAU,a2=o+(i+.5)/n*TAU;const rr=r*(1+(R()-.5)*j);
  const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)g.moveTo(px,py);else{const cr=r*(1.18+R()*.12);g.quadraticCurveTo(x+Math.cos(a2-TAU/n)*cr,y+Math.sin(a2-TAU/n)*cr,px,py);}}g.closePath();}
function glowSprite(c,size=64,hard=.15){const L=layer(size,size,1);const g=L.g;const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,rgba(tone(c,.5),1));gr.addColorStop(hard,rgba(c,.6));gr.addColorStop(.45,rgba(c,.16));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.fillRect(0,0,size,size);return L.c;}

// periodic ridge
function ridge(R,TW,amp,k0=1,k1=14,fall=1.05){const h=[];for(let k=k0;k<=k1;k++)h.push([k,amp/Math.pow(k,fall)*(.5+R()),R()*TAU]);return x=>{let s=0;for(const[k,a,p]of h)s+=a*Math.sin(TAU*k*x/TW+p);return s;};}

// ---------------- builders ----------------
let L={};
function buildSky(){
  const l=layer(LW,LH,S*.5),g=l.g,R=rng(3);
  const gr=g.createLinearGradient(0,0,0,GY);
  gr.addColorStop(0,rgba(tone(P.ink,-.45)));gr.addColorStop(.38,rgba(mix(P.ink,P.dusk,.42)));
  gr.addColorStop(.72,rgba(mix(P.dusk,P.moss,.28)));gr.addColorStop(1,rgba(tone(mix(P.dusk,P.moss,.45),.18)));
  g.fillStyle=gr;g.fillRect(0,0,LW,LH);
  // warm afterglow low-left vs cool moon high-right
  g.fillStyle=radial(g,40,GY-90,300,P.ember,.30);g.fillRect(0,0,LW,LH);
  g.fillStyle=radial(g,LW*.74,LH*.2,260,mix(P.moon,P.moss,.4),.16);g.fillRect(0,0,LW,LH);
  // soft cloud bands
  for(let i=0;i<9;i++){const y=LH*.12+R()*GY*.55,x=R()*LW,w=120+R()*220;g.save();g.translate(x,y);g.scale(1,.16);
    g.fillStyle=radial(g,0,0,w,mix(P.dusk,P.moon,.25),.13);g.beginPath();g.arc(0,0,w,0,TAU);g.fill();g.restore();}
  L.sky=l;
  const st=layer(LW,GY,S),sg=st.g;
  for(let i=0;i<260;i++){const y=Math.pow(R(),1.7)*GY*.8,x=R()*LW,a=(.25+R()*.75)*(1-y/(GY*.85));const r=R()<.94?.4+R()*.6:1.1+R()*.5;
    sg.fillStyle=rgba(R()<.2?tone(P.ember,.5):P.moon,a);sg.beginPath();sg.arc(x,y,r,0,TAU);sg.fill();
    if(r>1.1){sg.fillStyle=radial(sg,x,y,7,P.moon,a*.4);sg.fillRect(x-7,y-7,14,14);}}
  L.stars=st;
  L.twinkle=[];for(let i=0;i<22;i++)L.twinkle.push({x:R()*LW,y:Math.pow(R(),1.6)*GY*.6,p:R()*TAU,s:.6+R()*1.6});
}
function buildMoon(){
  const sz=360,l=layer(sz,sz,S),g=l.g,c=sz/2,r=36,R=rng(9);
  g.fillStyle=radial(g,c,c,c,mix(P.moon,P.moss,.3),.22);g.fillRect(0,0,sz,sz);
  g.fillStyle=radial(g,c,c,r*2.4,P.moon,.32);g.fillRect(0,0,sz,sz);
  const gr=g.createRadialGradient(c-10,c-12,2,c,c,r);gr.addColorStop(0,'#ffffff');gr.addColorStop(.55,rgba(tone(P.moon,.3)));gr.addColorStop(1,rgba(mix(P.moon,P.dusk,.35)));
  g.fillStyle=gr;g.beginPath();g.arc(c,c,r,0,TAU);g.fill();
  g.save();g.beginPath();g.arc(c,c,r,0,TAU);g.clip();
  for(let i=0;i<14;i++){const a=R()*TAU,d=R()*r*.8,cr=2+R()*8;g.fillStyle=radial(g,c+Math.cos(a)*d,c+Math.sin(a)*d,cr,mix(P.moon,P.moss,.45),.2);g.beginPath();g.arc(c+Math.cos(a)*d,c+Math.sin(a)*d,cr,0,TAU);g.fill();}
  g.fillStyle=radial(g,c+r*.7,c+r*.6,r*1.3,mix(P.dusk,P.ink,.3),.0,.0);
  const sh=g.createRadialGradient(c-r*.4,c-r*.4,r*.6,c,c,r*1.05);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,rgba(mix(P.dusk,P.moss,.4),.22));g.fillStyle=sh;g.fillRect(0,0,sz,sz);
  g.restore();
  L.moon=l;L.moonPos=[LW*.72,LH*.2];
  // god-ray sprite
  const rl=layer(60,900,.6*S),rg=rl.g;const h=rg.createLinearGradient(0,0,60,0);h.addColorStop(0,rgba(P.moon,0));h.addColorStop(.5,rgba(P.moon,1));h.addColorStop(1,rgba(P.moon,0));
  rg.fillStyle=h;rg.beginPath();rg.moveTo(28,0);rg.lineTo(32,0);rg.lineTo(60,900);rg.lineTo(0,900);rg.fill();
  rg.globalCompositeOperation='destination-in';const v=rg.createLinearGradient(0,0,0,900);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.12,'rgba(0,0,0,1)');v.addColorStop(.55,'rgba(0,0,0,.5)');v.addColorStop(1,'rgba(0,0,0,0)');rg.fillStyle=v;rg.fillRect(0,0,60,900);
  L.ray=rl;
}
function buildMountains(){
  const TW=900,top=GY-330,H=360,l=layer(TW,H,S*.5),g=l.g,R=rng(21);
  const r1=ridge(R,TW,70,1,40,1.35),r2=ridge(R,TW,52,2,44,1.3);
  const y1=x=>120+r1(x), y2=x=>205+r2(x);
  // far ridge
  let gr=g.createLinearGradient(0,40,0,H);gr.addColorStop(0,rgba(mix(P.dusk,P.moon,.2),.55));gr.addColorStop(.5,rgba(mix(P.dusk,P.moon,.14),.8));gr.addColorStop(1,rgba(mix(P.dusk,P.moss,.45),.95));
  g.fillStyle=gr;g.beginPath();g.moveTo(0,H);for(let x=0;x<=TW;x+=3)g.lineTo(x,y1(x));g.lineTo(TW,H);g.fill();
  g.lineWidth=1.6;for(let x=0;x<TW;x+=3){const s=y1(x+3)-y1(x);if(s>0){g.strokeStyle=rgba(P.moon,clamp(s*.12,0,.22));g.beginPath();g.moveTo(x,y1(x)+.6);g.lineTo(x+3,y1(x+3)+.6);g.stroke();}}
  // far-ridge gullies and snow streaks
  g.save();g.beginPath();g.moveTo(0,H);for(let x=0;x<=TW;x+=3)g.lineTo(x,y1(x));g.lineTo(TW,H);g.clip();
  for(let i=0;i<120;i++){const x=R()*TW,y=y1(x);const lit=R()<.5;g.strokeStyle=rgba(lit?P.moon:mix(P.ink,P.dusk,.6),lit?.12:.16);g.lineWidth=.8+R()*1.6;g.beginPath();g.moveTo(x,y+1);g.quadraticCurveTo(x+(R()-.5)*14,y+22,x+(R()-.5)*22,y+40+R()*60);g.stroke();}
  g.restore();
  // haze
  gr=g.createLinearGradient(0,150,0,H);gr.addColorStop(0,rgba(mix(P.dusk,P.moss,.35),0));gr.addColorStop(1,rgba(tone(mix(P.dusk,P.moss,.4),.15),.85));g.fillStyle=gr;g.fillRect(0,0,TW,H);
  // near ridge
  gr=g.createLinearGradient(0,120,0,H);gr.addColorStop(0,rgba(mix(P.ink,P.dusk,.62)));gr.addColorStop(1,rgba(mix(P.ink,P.moss,.4)));
  g.fillStyle=gr;g.beginPath();g.moveTo(0,H);for(let x=0;x<=TW;x+=3)g.lineTo(x,y2(x));g.lineTo(TW,H);g.fill();
  g.save();g.beginPath();g.moveTo(0,H);for(let x=0;x<=TW;x+=3)g.lineTo(x,y2(x));g.lineTo(TW,H);g.clip();
  for(let i=0;i<70;i++){const x=R()*TW,y=y2(x);g.strokeStyle=rgba(R()<.5?P.ink:mix(P.dusk,P.moon,.3),.18);g.lineWidth=1+R()*2;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+(R()-.5)*20,y+30,x+(R()-.5)*30,y+60+R()*60);g.stroke();}
  g.restore();
  g.lineWidth=1.4;for(let x=0;x<TW;x+=3){const s=y2(x+3)-y2(x);if(s>0){g.strokeStyle=rgba(P.moon,clamp(s*.14,0,.26));g.beginPath();g.moveTo(x,y2(x)+.6);g.lineTo(x+3,y2(x+3)+.6);g.stroke();}}
  gr=g.createLinearGradient(0,230,0,H);gr.addColorStop(0,rgba(mix(P.dusk,P.moss,.4),0));gr.addColorStop(1,rgba(mix(P.dusk,P.moss,.5),.7));g.fillStyle=gr;g.fillRect(0,0,TW,H);
  l.top=top;L.mount=l;
}
// ---- trees ----
function trunkPath(x,base,h,w0,lean,R){const pts=[];const n=8;for(let i=0;i<=n;i++){const t=i/n;const cx=x+lean*h*t*t+Math.sin(t*3+R()*0.3)*w0*.25;pts.push([cx,base-h*t,w0*(1-t*.68)*(1+(t<.12?(.12-t)*5:0))]);}return pts;}
function drawTrunk(g,pts,R,cols){
  const path=gg=>{gg.beginPath();gg.moveTo(pts[0][0]-pts[0][2]/2,pts[0][1]);for(const p of pts)gg.lineTo(p[0]-p[2]/2,p[1]);for(let i=pts.length-1;i>=0;i--){const p=pts[i];gg.lineTo(p[0]+p[2]/2,p[1]);}gg.closePath();};
  const x0=pts[0][0],w=pts[0][2];const gr=g.createLinearGradient(x0-w/2,0,x0+w/2,0);
  gr.addColorStop(0,rgba(cols.dark));gr.addColorStop(.55,rgba(cols.mid));gr.addColorStop(1,rgba(cols.light));g.fillStyle=gr;path(g);g.fill();
  g.save();path(g);g.clip();
  for(let i=0;i<40;i++){const t=R(),idx=Math.floor(t*(pts.length-1)),p=pts[idx];const ox=(R()-.5)*p[2];g.strokeStyle=rgba(R()<.6?cols.dark:cols.light,.35);g.lineWidth=.6+R()*1.2;
    g.beginPath();g.moveTo(p[0]+ox,p[1]);g.bezierCurveTo(p[0]+ox+(R()-.5)*3,p[1]-10,p[0]+ox+(R()-.5)*3,p[1]-20,p[0]+ox+(R()-.5)*2,p[1]-30-R()*30);g.stroke();}
  // knots
  for(let i=0;i<2;i++){const p=pts[1+Math.floor(R()*5)];g.fillStyle=rgba(cols.dark,.7);g.beginPath();g.ellipse(p[0]+(R()-.5)*p[2]*.4,p[1],p[2]*.12,p[2]*.2,0,0,TAU);g.fill();}
  g.restore();
  rim(g,path,-1.8,0,rgba(cols.rim,.45),2.4);
  // roots
  const b=pts[0];for(let i=0;i<4;i++){const dir=i<2?-1:1;const len=b[2]*(.7+R()*.8);g.fillStyle=rgba(i<2?cols.dark:cols.mid);g.beginPath();
    g.moveTo(b[0]+dir*b[2]*.15,b[1]-b[2]*.6);g.quadraticCurveTo(b[0]+dir*b[2]*.55,b[1]-2,b[0]+dir*(b[2]*.5+len),b[1]+2);g.lineTo(b[0]+dir*b[2]*.2,b[1]+2);g.fill();}
}
function branch(g,x,y,len,ang,w,col){g.strokeStyle=rgba(col);g.lineCap='round';let px=x,py=y;const n=6;for(let i=0;i<n;i++){const t=(i+1)/n;const nx=x+Math.cos(ang)*len*t,ny=y+Math.sin(ang)*len*t-Math.sin(t*3)*len*.08;g.lineWidth=w*(1-t*.75);g.beginPath();g.moveTo(px,py);g.lineTo(nx,ny);g.stroke();px=nx;py=ny;}return[px,py];}
function cluster(g,cx,cy,Rr,R,cols,detail=1){
  const n1=Math.round(9*detail+4);
  for(let i=0;i<n1;i++){const a=R()*TAU,d=R()*Rr*.55;g.fillStyle=rgba(tone(cols.dark,-.05*R()));bumpy(g,cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,Rr*(.35+R()*.3),R,11);g.fill();}
  for(let i=0;i<n1-2;i++){const a=R()*TAU,d=R()*Rr*.45;g.fillStyle=rgba(mix(cols.dark,cols.mid,.4+R()*.6));bumpy(g,cx+Rr*.14+Math.cos(a)*d,cy-Rr*.16+Math.sin(a)*d*.7,Rr*(.24+R()*.22),R,10);g.fill();}
  for(let i=0;i<Math.round(8*detail);i++){const a=-Math.PI/4+(R()-.5)*1.8,d=Rr*(.25+R()*.4);g.fillStyle=rgba(mix(cols.mid,cols.light,.3+R()*.7),.9);bumpy(g,cx+Math.cos(a)*d,cy+Math.sin(a)*d,Rr*(.12+R()*.14),R,9);g.fill();}
  // underside shadow so each cluster reads as a volume
  const sh=g.createRadialGradient(cx-Rr*.3,cy+Rr*.55,0,cx-Rr*.3,cy+Rr*.55,Rr*.9);sh.addColorStop(0,rgba(P.ink,.45));sh.addColorStop(1,rgba(P.ink,0));g.save();g.globalCompositeOperation='source-atop';g.fillStyle=sh;g.fillRect(cx-Rr*1.5,cy-Rr*.2,Rr*3,Rr*2);g.restore();
  if(detail>.6)for(let i=0;i<70*detail;i++){const a=R()*TAU,d=Math.sqrt(R())*Rr*.85;const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d*.8;const lit=(Math.cos(a+Math.PI/4)*d/Rr);
    g.fillStyle=rgba(lit>.2?cols.light:cols.dark,.25+R()*.35);g.beginPath();g.ellipse(x,y,1.6+R()*1.6,.8+R()*.7,R()*TAU,0,TAU);g.fill();}
  // soft moonlit edge on the upper-right of the cluster
  for(let i=0;i<5;i++){const a=-Math.PI*.55+R()*Math.PI*.55,d=Rr*(.55+R()*.2);const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d*.85,r=Rr*(.1+R()*.08);
    g.fillStyle=rgba(mix(cols.light,cols.rim,.35),.55);bumpy(g,x,y,r,R,8);g.fill();}
}
function makeTreeCols(depth){ // depth 0 near .. 1 far
  return{dark:mix(mix(P.ink,P.moss,.3),mix(P.dusk,P.moss,.5),depth*.55),mid:mix(mix(P.ink,P.moss,.6),mix(P.dusk,P.moss,.55),depth*.6),
    light:mix(mix(P.moss,P.moon,.2),mix(P.dusk,P.moon,.35),depth*.6),rim:P.moon};}
function treeAt(g,x,base,h,type,R,cols,detail,lanterns){
  const lean=(R()-.5)*.12,w0=type==='pine'?12+R()*8:16+R()*14;
  const tc={dark:tone(mix(P.ink,P.dusk,.35),-.1),mid:mix(P.ink,P.dusk,.55),light:mix(P.dusk,P.moon,.22),rim:P.moon};
  if(detail<1){tc.dark=cols.dark;tc.mid=mix(cols.dark,cols.mid,.4);tc.light=cols.mid;}
  const pts=trunkPath(x,base,h*(type==='pine'?.95:.72),w0,lean,R);drawTrunk(g,pts,R,tc);
  const top=pts[pts.length-1];
  if(type==='pine'){const tiers=6+Math.floor(R()*3);for(let i=0;i<tiers;i++){const t=i/tiers;const y=base-h*.28-t*h*.68,w=(1-t)*h*.26+10;
      for(let k=-1;k<=1;k+=2){cluster(g,top[0]+k*w*.45*(1-t*.2)+lean*(base-y)*.5,y+8,w*.42,R,cols,detail*.7);}cluster(g,top[0]+lean*(base-y)*.6,y,w*.5,R,cols,detail*.8);}
  }else{
    const nb=3+Math.floor(R()*3);const ends=[];
    for(let i=0;i<nb;i++){const t=.45+R()*.45;const p=pts[Math.floor(t*(pts.length-1))];const dir=i%2?1:-1;const ang=-Math.PI/2+dir*(.5+R()*.7);
      ends.push(branch(g,p[0],p[1],h*(.18+R()*.16),ang,p[2]*.5,tc.mid));}
    ends.push([top[0],top[1]]);
    const crownR=h*(type==='willow'?.15:.17);
    for(const e of ends)cluster(g,e[0],e[1]-crownR*.25,crownR*(.65+R()*.35),R,cols,detail);
    cluster(g,top[0],top[1]-crownR*.5,crownR*1.1,R,cols,detail);
    if(type==='willow'){for(let i=0;i<46;i++){const a=Math.PI*(.05+R()*.9),sx=top[0]+Math.cos(a)*crownR*1.5*(R()<.5?-1:1),sy=top[1]-crownR*.2+R()*crownR*.6;const len=40+R()*h*.35;
      g.strokeStyle=rgba(mix(cols.mid,cols.light,R()*.6),.75);g.lineWidth=1.2+R()*1.5;g.beginPath();g.moveTo(sx,sy);g.bezierCurveTo(sx+4,sy+len*.4,sx-3,sy+len*.7,sx+(R()-.5)*8,sy+len);g.stroke();
      for(let k=0;k<6;k++){const yy=sy+len*k/6;g.fillStyle=rgba(cols.light,.45);g.beginPath();g.ellipse(sx+(R()-.5)*4,yy,1.2,2.6,.3,0,TAU);g.fill();}}}
    if(lanterns&&R()<.85){const e=ends[Math.floor(R()*(ends.length-1))];const lx=e[0]+(R()-.5)*10,ly=e[1]+10;const len=26+R()*30;
      g.strokeStyle=rgba(tone(P.ink,.05));g.lineWidth=1;g.beginPath();g.moveTo(lx,ly-8);g.lineTo(lx,ly+len);g.stroke();
      const yy=ly+len;g.fillStyle=rgba(tone(P.ink,.1));g.fillRect(lx-5,yy,10,3);g.fillRect(lx-4,yy+15,8,2.5);
      const lg=g.createLinearGradient(lx-5,0,lx+5,0);lg.addColorStop(0,rgba(tone(P.ember,-.25)));lg.addColorStop(.5,rgba(tone(P.ember,.55)));lg.addColorStop(1,rgba(P.ember));
      g.fillStyle=lg;g.beginPath();g.moveTo(lx-4.5,yy+3);g.quadraticCurveTo(lx-6.5,yy+9,lx-4,yy+15);g.lineTo(lx+4,yy+15);g.quadraticCurveTo(lx+6.5,yy+9,lx+4.5,yy+3);g.fill();
      g.fillStyle=rgba([255,250,230],.95);g.beginPath();g.ellipse(lx,yy+10,1.6,2.8,0,0,TAU);g.fill();
      lanterns.push([lx,yy+9]);}
  }
}
function buildTrees(){
  // mid
  {const TW=1000,H=GY+20,l=layer(TW,H,S*.55),g=l.g,R=rng(41),cols=makeTreeCols(.75);
   const xs=[];for(let x=20;x<TW;x+=55+R()*70)xs.push(x);
   for(const x0 of xs){const h=180+R()*190,type=R()<.45?'pine':'oak',seed=R()*1e9|0;for(const off of[-TW,0,TW]){const RR=rng(seed);treeAt(g,x0+off,GY+10,h,type,RR,cols,.5,null);}}
   const gr=g.createLinearGradient(0,GY-160,0,GY+20);gr.addColorStop(0,rgba(mix(P.dusk,P.moss,.45),0));gr.addColorStop(1,rgba(tone(mix(P.dusk,P.moss,.45),.1),.9));g.fillStyle=gr;g.fillRect(0,0,TW,H);
   L.mid=l;}
  // near
  {const TW=1200,H=GY+30,l=layer(TW,H,S),g=l.g,R=rng(77),cols=makeTreeCols(.08);
   const specs=[[40,'oak',470],[360,'willow',420],[640,'pine',480],[980,'oak',440]];
   l.lanterns=[];
   for(const[x0,type,h] of specs){const seed=R()*1e9|0;for(const off of[-TW,0,TW]){const RR=rng(seed);const lan=off===0?l.lanterns:null;treeAt(g,x0+off+ (R()-.5)*0,GY+8,h+(rng(seed+1)()-.5)*60,type,RR,cols,1,lan);}}
