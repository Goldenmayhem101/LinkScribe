name: Gloamwood Android build

on:
  push:
    paths:
      - "gloamwood/**"
      - ".github/workflows/gloamwood-android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Move export templates and make a debug keystore
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import project
        working-directory: gloamwood
        run: godot --headless --editor --quit || true
      - name: Level generator test (600 stages, every jump must be reachable)
        working-directory: gloamwood
        run: godot --headless --script res://tools/test_levels.gd
      - name: Export debug APK
        working-directory: gloamwood
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/gloamwood-debug.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: gloamwood-debug-apk
          path: gloamwood/build/gloamwood-debug.apk
