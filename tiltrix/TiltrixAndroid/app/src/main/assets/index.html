<style>/* ===== Golden Mayhem kit: shared screens (intro, home, levels, daily, shop, settings, results, pause, gifts) ===== */
:root{
  --gm-bg:#101030; --gm-panel:#1c1a4a; --gm-panel-2:#14123a; --gm-edge:#3a3590; --gm-ink:#fff; --gm-muted:#a9a6d8;
  --gm-accent:#ffd23f; --gm-accent-ink:#1a1240; --gm-good:#36d48a; --gm-coin:#ffd23f; --gm-scrim:rgba(6,6,24,.82);
  --gm-font-display:system-ui,sans-serif; --gm-font-body:system-ui,sans-serif;
  --gm-safe-t:env(safe-area-inset-top,0px); --gm-safe-b:env(safe-area-inset-bottom,0px);
}
.gm-layer{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:calc(12px + var(--gm-safe-t)) max(14px,env(safe-area-inset-right,0px)) calc(12px + var(--gm-safe-b)) max(14px,env(safe-area-inset-left,0px));font-family:var(--gm-font-body);color:var(--gm-ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.gm-layer[hidden]{display:none!important}
.gm-scrim{background:var(--gm-scrim)}
.gm-panel{width:min(100%,380px);max-height:100%;overflow:auto;background:var(--gm-panel);border-radius:26px;box-shadow:0 0 0 2px var(--gm-edge),0 24px 50px rgba(0,0,0,.45);padding:20px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:gm-in .22s ease-out;scrollbar-width:none}
.gm-panel::-webkit-scrollbar{display:none}
@keyframes gm-in{from{transform:scale(.92);opacity:0}}
.gm-panel h2{margin:0;font:400 30px/1 var(--gm-font-display);letter-spacing:.01em}
.gm-panel h3{margin:0;font:800 13px/1 var(--gm-font-body);letter-spacing:.14em;color:var(--gm-muted);text-transform:uppercase}
.gm-p{margin:0;color:var(--gm-muted);font-size:15px;line-height:1.35;font-weight:600}
.gm-btn{appearance:none;border:0;border-radius:18px;padding:14px 16px;font:400 22px/1 var(--gm-font-display);background:var(--gm-accent);color:var(--gm-accent-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.gm-btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.gm-btn.sec{background:var(--gm-panel-2);color:var(--gm-ink);box-shadow:inset 0 0 0 2px var(--gm-edge),inset 0 -4px 0 rgba(0,0,0,.25)}
.gm-btn.good{background:var(--gm-good);color:#062a18}
.gm-btn.ghost{background:transparent;color:var(--gm-muted);box-shadow:none;font:800 16px var(--gm-font-body);padding:6px}
.gm-btn.sm{font-size:17px;padding:11px 12px;border-radius:14px}
.gm-btn:disabled{opacity:.45}
.gm-btn:focus-visible,.gm-icon:focus-visible,.gm-tile:focus-visible{outline:3px solid var(--gm-accent);outline-offset:2px}
.gm-ad{font:800 11px var(--gm-font-body);background:rgba(0,0,0,.22);border-radius:6px;padding:3px 5px;letter-spacing:.06em}
.gm-row{display:flex;gap:10px}
.gm-row>*{flex:1}
.gm-coin{color:var(--gm-coin);font-weight:900}
.gm-x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--gm-panel-2);color:var(--gm-ink);font:900 18px var(--gm-font-body);box-shadow:inset 0 0 0 2px var(--gm-edge);cursor:pointer}
.gm-head{position:relative;padding-right:40px;padding-left:40px}

/* ---- intro ---- */
#gm-intro{background:#07060f;padding:0;z-index:400;cursor:pointer}
#gm-intro canvas{width:100%;height:100%;display:block}
#gm-intro .gm-skip{position:absolute;bottom:calc(18px + var(--gm-safe-b));left:0;right:0;text-align:center;font:700 12px var(--gm-font-body);letter-spacing:.2em;color:rgba(255,255,255,.35)}

/* ---- home ---- */
#gm-home{z-index:150;place-items:stretch;padding-top:calc(10px + var(--gm-safe-t))}
#gm-home .gm-home{display:flex;flex-direction:column;height:100%;max-width:440px;width:100%;margin:0 auto;gap:10px}
.gm-top{display:flex;align-items:center;gap:8px}
.gm-pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:7px 14px 7px 10px;font:900 18px var(--gm-font-body);color:var(--gm-coin);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.gm-pill .ic{font-size:18px}
.gm-spacer{flex:1}
.gm-icon{position:relative;width:46px;height:46px;border-radius:15px;border:0;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);color:var(--gm-ink);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
.gm-icon svg{width:24px;height:24px}
.gm-icon .gm-t{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font:900 10px var(--gm-font-body);background:var(--gm-panel-2);color:var(--gm-muted);padding:2px 5px;border-radius:6px;white-space:nowrap}
.gm-icon.ready{background:var(--gm-accent);color:var(--gm-accent-ink);animation:gm-wiggle 1.6s infinite}
.gm-icon.ready .gm-t{background:var(--gm-good);color:#062a18}
@keyframes gm-wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.gm-dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px var(--gm-bg)}
.gm-title{flex:1;min-height:120px;display:grid;place-items:center;pointer-events:none}
.gm-menu{display:flex;flex-direction:column;gap:10px;padding-bottom:calc(8px + var(--gm-safe-b))}
.gm-play{font-size:34px;padding:18px;border-radius:22px;animation:gm-breathe 2.4s ease-in-out infinite}
@keyframes gm-breathe{50%{transform:scale(1.03)}}
.gm-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gm-card{position:relative;border:0;border-radius:18px;background:var(--gm-panel);box-shadow:inset 0 0 0 2px var(--gm-edge),inset 0 -4px 0 rgba(0,0,0,.25);color:var(--gm-ink);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font:400 18px/1 var(--gm-font-display);cursor:pointer;touch-action:manipulation}
.gm-card svg{width:30px;height:30px}
.gm-card small{font:800 11px var(--gm-font-body);color:var(--gm-muted);letter-spacing:.04em}
.gm-card:active{transform:translateY(2px)}
.gm-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
.gm-chip{border:0;border-radius:999px;padding:7px 11px;background:rgba(0,0,0,.35);color:var(--gm-ink);font:800 13px var(--gm-font-body);box-shadow:inset 0 0 0 2px rgba(255,255,255,.1);cursor:pointer;display:flex;gap:5px;align-items:center}
.gm-chip.on{background:var(--gm-good);color:#062a18;box-shadow:none}
.gm-chip b{font-weight:900;opacity:.75}
.gm-chest{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border-radius:16px;padding:8px 12px;border:0;color:var(--gm-ink);font:800 13px var(--gm-font-body);cursor:pointer;text-align:left}
.gm-chest .bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.gm-chest .bar i{display:block;height:100%;background:var(--gm-accent);border-radius:6px;transition:width .4s}
.gm-chest.ready{background:var(--gm-accent);color:var(--gm-accent-ink);animation:gm-breathe 1.2s infinite}
.gm-chest.ready .bar{display:none}
.gm-chest svg{width:26px;height:26px;flex:none}

/* ---- levels ---- */
.gm-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gm-tile{position:relative;aspect-ratio:1;border:0;border-radius:14px;background:var(--gm-panel-2);color:var(--gm-ink);box-shadow:inset 0 0 0 2px var(--gm-edge),inset 0 -4px 0 rgba(0,0,0,.25);font:400 20px/1 var(--gm-font-display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.gm-tile .st{font-size:10px;letter-spacing:-1px;color:rgba(255,255,255,.25)}
.gm-tile .st b{color:var(--gm-accent);font-weight:400}
.gm-tile.locked{opacity:.4}
.gm-tile.next{background:var(--gm-accent);color:var(--gm-accent-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.gm-tile.next .st{color:rgba(0,0,0,.25)}
.gm-starsum{font:900 15px var(--gm-font-body);color:var(--gm-accent)}

/* ---- daily ---- */
.gm-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gm-cal .wd{font:900 10px var(--gm-font-body);color:var(--gm-muted);padding:2px 0}
.gm-cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:800 13px var(--gm-font-body);background:var(--gm-panel-2);color:var(--gm-muted)}
.gm-cal .d.done{background:var(--gm-accent);color:var(--gm-accent-ink)}
.gm-cal .d.today{box-shadow:inset 0 0 0 2px var(--gm-ink);color:var(--gm-ink)}
.gm-cal .d.done.today{color:var(--gm-accent-ink)}
.gm-cal .d.fut{opacity:.35}
.gm-cal .d.e{background:transparent}
.gm-streak{display:flex;align-items:center;justify-content:center;gap:8px;font:400 24px var(--gm-font-display)}
.gm-streak svg{width:28px;height:28px}
.gm-goal{background:var(--gm-panel-2);border-radius:14px;padding:10px 12px;font:700 14px/1.35 var(--gm-font-body);color:var(--gm-ink);text-align:left;box-shadow:inset 0 0 0 2px var(--gm-edge)}
.gm-goal b{color:var(--gm-accent)}

/* ---- shop ---- */
.gm-tabs{display:flex;background:var(--gm-panel-2);border-radius:14px;padding:4px;gap:4px}
.gm-tabs button{flex:1;border:0;border-radius:11px;padding:9px;background:transparent;color:var(--gm-muted);font:900 14px var(--gm-font-body);cursor:pointer}
.gm-tabs button.on{background:var(--gm-edge);color:var(--gm-ink)}
.gm-items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gm-item{border:0;border-radius:16px;background:var(--gm-panel-2);color:var(--gm-ink);box-shadow:inset 0 0 0 2px var(--gm-edge);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:800 14px var(--gm-font-body)}
.gm-item.on{box-shadow:inset 0 0 0 3px var(--gm-accent)}
.gm-item .sw{width:54px;height:54px;border-radius:14px;display:grid;place-items:center}
.gm-item .sw svg{width:34px;height:34px}
.gm-item .ds{font:700 11px/1.25 var(--gm-font-body);color:var(--gm-muted);min-height:28px}
.gm-price{font:900 14px var(--gm-font-body);color:var(--gm-coin);display:flex;gap:4px;align-items:center}
.gm-price.own{color:var(--gm-good)}
.gm-item.poor .gm-price{opacity:.55}
.gm-shake{animation:gm-shake .25s}
@keyframes gm-shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---- settings ---- */
.gm-set{display:flex;flex-direction:column;gap:8px}
.gm-tog{display:flex;align-items:center;gap:12px;background:var(--gm-panel-2);border-radius:14px;padding:10px 12px;font:800 16px var(--gm-font-body);border:0;color:var(--gm-ink);cursor:pointer;text-align:left;box-shadow:inset 0 0 0 2px var(--gm-edge)}
.gm-tog svg{width:24px;height:24px;flex:none;color:var(--gm-muted)}
.gm-tog span{flex:1}
.gm-sw{width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;transition:background .2s;flex:none}
.gm-sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.gm-tog.on .gm-sw{background:var(--gm-good)}
.gm-tog.on .gm-sw::after{transform:translateX(20px)}
.gm-foot{font:700 11px var(--gm-font-body);color:var(--gm-muted);letter-spacing:.04em}

/* ---- results ---- */
.gm-stars{display:flex;justify-content:center;gap:6px;height:56px;align-items:flex-end}
.gm-stars svg{width:46px;height:46px;opacity:.18;transform:scale(.6);transition:all .35s cubic-bezier(.4,1.8,.6,1)}
.gm-stars svg:nth-child(2){width:56px;height:56px}
.gm-stars svg.on{opacity:1;transform:scale(1)}
.gm-big{font:400 64px/1 var(--gm-font-display);color:var(--gm-accent)}
.gm-earn{display:flex;align-items:center;justify-content:center;gap:8px;font:900 20px var(--gm-font-body);color:var(--gm-coin)}
.gm-newbest{display:inline-block;background:var(--gm-good);color:#062a18;font:900 12px var(--gm-font-body);letter-spacing:.12em;padding:5px 10px;border-radius:999px;align-self:center;animation:gm-breathe 1s infinite}

/* ---- chest / gift ---- */
.gm-prize{width:120px;height:120px;margin:0 auto;display:grid;place-items:center}
.gm-prize svg{width:110px;height:110px}
.gm-prize.shake svg{animation:gm-chestshake .5s infinite}

function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);
    musicGain=ac.createGain();musicGain.gain.value=S.set.music?1:0;musicGain.connect(master);sfxGain=ac.createGain();sfxGain.connect(master)}catch(e){}}

function tone(f1,f2,d,type='sine',v=.07,delay=0){
  if(!S.set.sound||!audio())return;
  try{const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+d);

}

  no:()=>tone(220,160,.18,'sawtooth',.04),open:()=>[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,f*1.01,.18,'triangle',.05,i*.06))};
/* music: soft generative arpeggio over a 4-chord loop */
let mus={on:false,timer:0,step:0,next:0};
function musicStart(){if(!audio()||mus.on)return;mus.on=true;mus.next=ac.currentTime+.1;mus.step=0;musTick()}
function musTick(){
  if(!mus.on)return;const M=C.music||{};const prog=M.prog||[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];const root=M.root||220,bpm=M.bpm||92,spb=60/bpm/2;
  while(mus.next<ac.currentTime+.4){
    const bar=Math.floor(mus.step/8)%prog.length,ch=prog[bar],i=mus.step%8,t=mus.next;
    const pat=M.pattern||[0,1,2,1,0,2,1,2];const semi=ch[pat[i]%ch.length]+(i===5?12:0);const f=root*Math.pow(2,semi/12);
    note(f,t,spb*1.8,M.wave||'triangle',.022);
    if(i===0)note(root/2*Math.pow(2,ch[0]/12),t,spb*7,'sine',.035);
    mus.step++;mus.next+=spb;
  }
  mus.timer=setTimeout(musTick,120);
}
function note(f,t,d,type,v){try{const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(lp).connect(g).connect(musicGain);o.start(t);o.stop(t+d+.05)}catch(e){}}
function musicStop(){mus.on=false;clearTimeout(mus.timer)}

  const first=!S.intro;S.intro=(S.intro||0)+1;save();
  const L=h('div','gm-layer');L.id='gm-intro';L.innerHTML='<canvas></canvas><div class="gm-skip">TAP TO SKIP</div>';document.body.appendChild(L);
  const cv=$('canvas',L),g=cv.getContext('2d');let W,H,dpr;
  function rs(){dpr=Math.min(2,devicePixelRatio||1);W=L.clientWidth;H=L.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}rs();addEventListener('resize',rs);
  const studio=first?2.1:0,logo=first?2.3:1.25,total=studio+logo;let t0=performance.now(),end=false;
  function finish(){if(end)return;end=true;removeEventListener('resize',rs);L.style.transition='opacity .35s';L.style.opacity='0';setTimeout(()=>{L.remove();done()},350)}
  L.addEventListener('pointerdown',finish);
  (function fr(now){if(end)return;const t=Math.max(0,(now-t0)/1000);
    g.fillStyle='#07060f';g.fillRect(0,0,W,H);
    if(studio>0&&t<studio){drawStudio(g,W,H,t/studio)}
    else{const p=Math.min(1,(t-studio)/logo);g.save();C.intro.draw(g,W,H,p,t-studio);g.restore();
      const fade=p<.12?1-p/.12:0;if(first&&fade>0){g.fillStyle=`rgba(7,6,15,${fade})`;g.fillRect(0,0,W,H)}}

}
function drawStudio(g,W,H,p){
  const a=p<.22?p/.22:p>.8?Math.max(0,1-(p-.8)/.2):1;const cx=W/2,cy=H/2;

  o.textAlign='center';o.textBaseline='middle';o.font='400 '+Math.round(fs)+'px '+dispFont();
  const gr=o.createLinearGradient(0,th/2-fs/2,0,th/2+fs/2);gr.addColorStop(0,'#fff3b0');gr.addColorStop(.5,'#ffc62e');gr.addColorStop(1,'#e88a12');

  g.drawImage(oc,0,cy+4-th/2,tw,th);

  for(let d=1;d<=days;d++){const k=dayKey(new Date(y,m,d));cal+=`<div class="d${S.daily.done[k]?' done':''}${d===today?' today':''}${d>today?' fut':''}">${S.daily.done[k]?'★':d}</div>`}
  cal+='</div>';
  const done=!!S.daily.done[dayKey()],st=streakNow(),rew=dailyReward(done?st:st+1);
  const mid=new Date(y,m,today+1)-now;
  const body=`<h3>${now.toLocaleString('en',{month:'long'})} ${y}</h3>${cal}
   <div class="gm-streak">${I.flame}<span>${st} day streak</span></div>
   <div class="gm-goal">${C.daily.goal}<br>Reward: ${coinTxt(rew)} ${done?'':'<span style="color:var(--gm-muted)">(grows with your streak)</span>'}</div>

/** call when the player beats today's challenge; returns the coin reward (0 if already done today) */
function dailyComplete(key){
  key=key||dayKey();if(S.daily.done[key])return 0;
  S.daily.done[key]=true;S.daily.streak=(S.daily.last===yesterdayKey()?S.daily.streak:0)+1;S.daily.last=key;
  // keep the stored calendar small (about 3 months)
  const keys=Object.keys(S.daily.done).sort();while(keys.length>100)delete S.daily.done[keys.shift()];
  save();return dailyReward(S.daily.streak);
}

<script>

const N=8, COLS=6, STONE=7, LEVELS=60;
const $=s=>document.querySelector(s);
const boardEl=$('#board'), trayEl=$('#tray'), stage=$('#stage'), app=$('#app');

/* ---------- seeded random: every level and Daily Challenge is the same for everyone ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;

const RAW=[["X",3],["XX",6],["X|X",6],["XXX",6],["X|X|X",6],["XXXX",4],["X|X|X|X",4],["XXXXX",2],["X|X|X|X|X",2],["XX|XX",6],["XXX|XXX|XXX",1.5],
["X.|XX",4],["XX|X.",4],["XX|.X",4],[".X|XX",4],["X..|X..|XXX",1.5],["XXX|X..|X..",1.5],["XXX|..X|..X",1.5],["..X|..X|XXX",1.5],
["XXX|.X.",3],[".X.|XXX",3],["X.|XX|X.",3],[".X|XX|.X",3],["XX.|.XX",2.5],[".XX|XX.",2.5],["X.|XX|.X",2.5],[".X|XX|X.",2.5],
["X.|X.|XX",3],["XX|.X|.X",3],["XX|X.|X.",3],[".X|.X|XX",3]];
const shapeOf=s=>{const rows=s.split('|');const cells=[];rows.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')cells.push([r,c])}));return{cells,h:rows.length,w:rows[0].length}};
const SHAPES=RAW.map(([s,w])=>Object.assign(shapeOf(s),{weight:w}));
const TOTALW=SHAPES.reduce((a,s)=>a+s.weight,0);
function randShape(){let x=rng()*TOTALW;for(const s of SHAPES){x-=s.weight;if(x<=0)return s}return SHAPES[0]}
function newPiece(){return{shape:randShape(),color:1+Math.floor(rng()*COLS)}}
function smallPiece(){const s=SHAPES[Math.floor(Math.random()*3)];return{shape:s,color:1+Math.floor(Math.random()*COLS)}}

function levelCfg(i){return{mode:'level',level:i,target:150+i*45,stones:Math.min(i<30?14:18,Math.floor(i*0.6)),tilts:i<10?3:2,seed:9973*(i+1)+7,par:PAR[i]||Math.round((150+i*45)/11)}}
function dailyCfg(seed,key){const T=[[900,6,3],[500,4,3],[700,16,2],[700,8,3],[700,10,2],[600,10,1],[800,10,4]][new Date().getDay()];return{mode:'daily',target:T[0],stones:T[1],tilts:T[2],seed,key}}
const endlessCfg=()=>({mode:'endless',tilts:3,stones:0,seed:null});

let grid, pieces, score, charges, meter, combo, busy=false, revived=false, over=true, cfg=endlessCfg(), placed=0, boosts={}, tool=null, tut=0;
const cells=[];
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell';boardEl.appendChild(d);cells.push(d)}

/* ---------- sound + haptics through the kit (respect the player's settings) ---------- */
const blip=(f,d=.08,type='sine',vol=.07)=>GM.tone(f,f,d,type,vol);
const buzz=ms=>GM.vibrate(ms);

/* ---------- board logic ---------- */
function fits(shape,r,c,g=grid){for(const [dr,dc] of shape.cells){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=N||cc>=N||g[rr][cc])return false}return true}
function canFitAnywhere(shape,g=grid){for(let r=0;r<=N-shape.h;r++)for(let c=0;c<=N-shape.w;c++)if(fits(shape,r,c,g))return true;return false}
function fullLines(g){const rows=[],cols=[];for(let r=0;r<N;r++)if(g[r].every(v=>v))rows.push(r);for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++)if(!g[r][c]){f=false;break}if(f)cols.push(c)}return{rows,cols}}
function tiltGrid(g,dir){
  const ng=empty(),moves=[];
  for(let k=0;k<N;k++){
    const co=[];
    for(let t=0;t<N;t++){co.push(dir==='L'?[k,t]:dir==='R'?[k,N-1-t]:dir==='U'?[t,k]:[N-1-t,k])}
    let w=0;
    for(const [r,c] of co){if(g[r][c]){const [tr,tc]=co[w++];ng[tr][tc]=g[r][c];if(tr!==r||tc!==c)moves.push({r,c,tr,tc})}}
  }
  return{ng,moves};
}
function clearSim(g){const {rows,cols}=fullLines(g);const h=g.map(r=>r.slice());rows.forEach(r=>{for(let c=0;c<N;c++)h[r][c]=0});cols.forEach(c=>{for(let r=0;r<N;r++)h[r][c]=0});return h}

/* ---------- rendering ---------- */
function render(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=grid[r][c];cells[r*N+c].className=v?'cell f k'+v:'cell'}}
function renderHud(){
  $('#score').textContent=score;
  if(cfg.target){$('#rLabel').textContent='TARGET';$('#best').textContent=cfg.target;$('#goalbar').hidden=false;$('#goalfill').style.width=Math.min(100,score/cfg.target*100)+'%'}
  else{$('#rLabel').textContent='BEST';$('#best').textContent=Math.max(GM.best('endless'),score);$('#goalbar').hidden=true}
  $('#mid').innerHTML=cfg.tut?'<div class="lvl">Tutorial</div>':cfg.mode==='level'?`<div class="lvl">Level ${cfg.level+1}</div>`:cfg.mode==='daily'?'<div class="lvl">Daily</div>':'<div class="logo" aria-hidden="true"><span>T</span><span>I</span><span>L</span><span>T</span><span>R</span><span>I</span><span>X</span></div>';
  const pips=$('#pips');pips.innerHTML='';
  for(let i=0;i<5;i++){const p=document.createElement('div');p.className='pip'+(i<charges?' on':'');pips.appendChild(p)}
  const m=document.createElement('div');m.className='meter';m.title='Lines toward next tilt';
  for(let i=0;i<3;i++){const d=document.createElement('i');if(i<meter)d.className='on';m.appendChild(d)}
  pips.appendChild(m);
  document.querySelectorAll('.arrow').forEach(b=>b.disabled=charges<=0);
  renderTools();
}
function renderTools(){
  const box=$('#tools');box.innerHTML='';
  if(boosts.reroll){const b=document.createElement('button');b.className='tool';b.innerHTML='🔄 Reroll';b.onclick=useReroll;box.appendChild(b)}
  if(boosts.bomb){const b=document.createElement('button');b.className='tool'+(tool==='bomb'?' on':'');b.innerHTML=tool==='bomb'?'💣 Tap a spot!':'💣 Bomb';b.onclick=()=>{tool=tool==='bomb'?null:'bomb';boardEl.classList.toggle('bombing',tool==='bomb');renderTools()};box.appendChild(b)}
  box.hidden=!box.children.length;
}
function renderTray(){
  trayEl.innerHTML='';
  pieces.forEach((p,i)=>{
    const slot=document.createElement('div');slot.className='slot';slot.dataset.i=i;
    if(p){
      const m=document.createElement('div');m.className='mini k'+p.color;
      m.style.gridTemplateColumns=`repeat(${p.shape.w},var(--m))`;m.style.gridTemplateRows=`repeat(${p.shape.h},var(--m))`;
      p.shape.cells.forEach(([r,c])=>{const b=document.createElement('i');b.style.gridRow=r+1;b.style.gridColumn=c+1;m.appendChild(b)});
      if(!canFitAnywhere(p.shape))slot.classList.add('dead');
      slot.appendChild(m);
    }
    trayEl.appendChild(slot);
  });
}
function toast(big,small){const t=document.createElement('div');t.className='toast';t.innerHTML=big+(small?`<small>${small}</small>`:'');stage.appendChild(t);setTimeout(()=>t.remove(),1000)}
function geom(){const br=boardEl.getBoundingClientRect();const pad=8,gap=4;const pitch=(br.width-2*pad+gap)/N;return{left:br.left+pad,top:br.top+pad,pitch,size:pitch-gap}}
function cellCenter(r,c){const g=geom();return{x:g.left+c*g.pitch+g.size/2,y:g.top+r*g.pitch+g.size/2}}
function applySkin(id){[...document.body.classList].forEach(c=>c.startsWith('sk-')&&document.body.classList.remove(c));if(id&&id!=='classic')document.body.classList.add('sk-'+id)}

/* ---------- dragging ---------- */
let drag=null;
trayEl.addEventListener('pointerdown',e=>{
  if(busy||over||tool)return;
  const slot=e.target.closest('.slot');if(!slot)return;
  const i=+slot.dataset.i,p=pieces[i];if(!p)return;
  e.preventDefault();
  const g=geom();
  const f=document.createElement('div');f.className='float k'+p.color;
  f.style.width=(p.shape.w*g.pitch-4)+'px';f.style.height=(p.shape.h*g.pitch-4)+'px';
  p.shape.cells.forEach(([r,c])=>{const b=document.createElement('i');b.style.left=c*g.pitch+'px';b.style.top=r*g.pitch+'px';b.style.width=b.style.height=g.size+'px';f.appendChild(b)});
  document.body.appendChild(f);slot.classList.add('lifted');
  drag={i,p,f,g,slot,lift:e.pointerType==='mouse'?0:Math.max(64,g.pitch*1.7),pos:null};
  if(tut)GM.handHide();
  moveDrag(e);
  addEventListener('pointermove',moveDrag);addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
});
function moveDrag(e){
  if(!drag)return;
  const {p,f,g}=drag;
  const w=p.shape.w*g.pitch-4,h=p.shape.h*g.pitch-4;
  const x=e.clientX-w/2,y=e.clientY-h/2-drag.lift;
  f.style.transform=`translate(${x}px,${y}px)`;
  const c=Math.round((x-g.left)/g.pitch),r=Math.round((y-g.top)/g.pitch);
  const ok=fits(p.shape,r,c);
  const key=ok?r+','+c:'';
  if(key!==drag.key){drag.key=key;drag.pos=ok?[r,c]:null;showGhost(ok?p:null,r,c)}
}
function showGhost(p,r,c){
  render();if(!p)return;
  const tmp=grid.map(row=>row.slice());
  p.shape.cells.forEach(([dr,dc])=>{cells[(r+dr)*N+c+dc].className='cell ghost k'+p.color;tmp[r+dr][c+dc]=p.color});
  const {rows,cols}=fullLines(tmp);
  rows.forEach(rr=>{for(let cc=0;cc<N;cc++)cells[rr*N+cc].classList.add('will')});
  cols.forEach(cc=>{for(let rr=0;rr<N;rr++)cells[rr*N+cc].classList.add('will')});
}
function endDrag(){
  removeEventListener('pointermove',moveDrag);removeEventListener('pointerup',endDrag);removeEventListener('pointercancel',endDrag);
  const d=drag;drag=null;if(!d)return;
  d.f.remove();d.slot.classList.remove('lifted');
  if(d.pos&&tut===1&&!(d.pos[0]===7&&d.pos[1]===6)){render();GM.toast('Drop it in the gap in the bottom row');tutStep();return}
  if(d.pos)place(d.i,d.pos[0],d.pos[1]);else{render();if(tut)tutStep()}
}

/* ---------- moves ---------- */
function place(i,r,c){
  const p=pieces[i];
  p.shape.cells.forEach(([dr,dc])=>grid[r+dr][c+dc]=p.color);
  if(!tut&&Math.random()<.16){const q=p.shape.cells[Math.floor(Math.random()*p.shape.cells.length)];grid[r+q[0]][c+q[1]]=8+Math.floor(Math.random()*4)}
  pieces[i]=null;score+=p.shape.cells.length;placed++;
  blip(440+p.shape.cells.length*40,.06,'triangle');buzz(8);
  render();
  resolve(()=>{if(!tut&&pieces.every(x=>!x))pieces=[newPiece(),newPiece(),newPiece()];afterMove()});
}
function txFx(src){const b=boardEl.getBoundingClientRect(),i=document.createElement('img'),s=b.width*.8;i.src=src;i.style.cssText='position:fixed;pointer-events:none;z-index:50;transition:transform .5s,opacity .5s;transform:scale(.4);opacity:1;width:'+s+'px;left:'+(b.left+b.width/2-s/2)+'px;top:'+(b.top+b.height/2-s/2)+'px';document.body.appendChild(i);requestAnimationFrame(()=>{i.style.transform='scale(1.15)'});setTimeout(()=>{i.style.opacity=0},350);setTimeout(()=>i.remove(),900)}
function resolve(done){
  const {rows,cols}=fullLines(grid);
  const n=rows.length+cols.length;
  if(!n){combo=0;done();return}
  busy=true;combo++;
  const hit=new Set();
  rows.forEach(r=>{for(let c=0;c<N;c++)hit.add(r*N+c)});
  cols.forEach(c=>{for(let r=0;r<N;r++)hit.add(r*N+c)});
  let spb=0,sq=[...hit];while(sq.length){const k=sq.pop(),r0=Math.floor(k/N),c0=k%N,v=grid[r0][c0],ad=(r,c)=>{if(r<0||c<0||r>=N||c>=N)return;const q=r*N+c;if(!hit.has(q)){hit.add(q);sq.push(q)}};if(v===8)for(let c=0;c<N;c++)ad(r0,c);else if(v===9)for(let r=0;r<N;r++)ad(r,c0);else if(v===10){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)ad(r0+a,c0+b)}else if(v===11)spb+=40}
  hit.forEach(k=>cells[k].classList.add('pop'));
  const gain=10*n*n*combo+spb;score+=gain;
  const label=n>=4?'MEGA!':n===3?'TRIPLE!':n===2?'DOUBLE!':'';
  toast('+'+gain,[label,combo>1?'combo ×'+combo:''].filter(Boolean).join(' · '));
  [0,1,2].slice(0,Math.min(3,n)).forEach((k,j)=>setTimeout(()=>blip(660+j*220,.12,'sine',.08),j*70));
  buzz(25);if(spb||n>=3)txFx('img/sp/boom.webp');
  meter+=n;let earned=0;
  if(n>=2)earned++;
  while(meter>=3){meter-=3;earned++}
  setTimeout(()=>{
    hit.forEach(k=>grid[Math.floor(k/N)][k%N]=0);
    if(earned){const before=charges;charges=Math.min(5,charges+earned);if(charges>before)setTimeout(()=>toast('+'+(charges-before)+' TILT'),250)}
    render();busy=false;done();
  },310);
}
function tilt(dir){
  if(busy||over||drag||tool)return;
  if(tut===1)return;
  if(charges<=0){boardEl.classList.remove('nudge');void boardEl.offsetWidth;boardEl.classList.add('nudge');return}
  const {ng,moves}=tiltGrid(grid,dir);
  if(!moves.length){boardEl.classList.remove('nudge');void boardEl.offsetWidth;boardEl.classList.add('nudge');return}
  busy=true;charges--;grid=ng;if(tut)GM.handHide();
  const pitch=geom().pitch;
  render();
  moves.forEach(m=>{const el=cells[m.tr*N+m.tc];el.style.transition='none';el.style.transform=`translate(${(m.c-m.tc)*pitch}px,${(m.r-m.tr)*pitch}px)`});
  void boardEl.offsetWidth;
  moves.forEach(m=>{const el=cells[m.tr*N+m.tc];el.style.transition='transform .24s cubic-bezier(.5,0,.25,1.25)';el.style.transform=''});
  blip(180,.22,'sawtooth',.04);buzz(15);
  setTimeout(()=>{boardEl.classList.add('bump-'+dir);setTimeout(()=>boardEl.classList.remove('bump-'+dir),130)},200);
  setTimeout(()=>{cells.forEach(el=>{el.style.transition='';el.style.transform=''});busy=false;resolve(afterMove)},260);
}
function useReroll(){if(busy||over||drag)return;boosts.reroll=false;pieces=pieces.map(()=>newPiece());blip(500,.15,'triangle');GM.toast('🔄 New pieces!');afterMove()}
function bombAt(r0,c0){
  tool=null;boosts.bomb=false;boardEl.classList.remove('bombing');busy=true;let n=0;
  for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++){if(r<0||c<0||r>=N||c>=N)continue;if(grid[r][c]){n++;cells[r*N+c].classList.add('boom')}}
  GM.tone(160,40,.5,'sawtooth',.08);buzz(60);boardEl.classList.remove('nudge');void boardEl.offsetWidth;boardEl.classList.add('nudge');
  setTimeout(()=>{for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++){if(r>=0&&c>=0&&r<N&&c<N)grid[r][c]=0}score+=n*2;render();busy=false;if(n)toast('BOOM!','+'+n*2);afterMove()},360);
}
function afterMove(){
  renderTray();renderHud();
  if(tut){tutStep();return}
  if(cfg.target&&score>=cfg.target){win();return}
  const live=pieces.filter(Boolean);
  const anyFit=live.some(p=>canFitAnywhere(p.shape));
  const bar=$('#tiltbar');bar.classList.remove('urge');
  if(anyFit)return;
  if(boosts.reroll||boosts.bomb){toast('NO ROOM',boosts.bomb?'use your bomb!':'reroll your pieces!');return}
  if(charges>0){
    const rescue=['L','R','U','D'].some(d=>{const {ng,moves}=tiltGrid(grid,d);if(!moves.length)return false;const g2=clearSim(ng);return live.some(p=>canFitAnywhere(p.shape,g2))});
    if(rescue){bar.classList.add('urge');toast('NO ROOM','tilt the board!');return}
  }
  gameOver();
}

/* ---------- run flow ---------- */
function placeStones(n){
  let tries=0;while(n>0&&tries<500){tries++;const r=Math.floor(rng()*N),c=Math.floor(rng()*N);if(grid[r][c])continue;grid[r][c]=STONE;
    const {rows,cols}=fullLines(grid);if(rows.length||cols.length){grid[r][c]=0;continue}n--}
}
function start(c){
  cfg=c;rng=c.seed!=null?mulberry(c.seed):Math.random;
  window.txSetWorld&&window.txSetWorld(c.mode==='level'&&!c.tut?['forest','ocean','icecave','night','sky','nebula'][Math.min(5,Math.floor(c.level/10))]:null);grid=empty();placeStones(c.stones||0);pieces=[newPiece(),newPiece(),newPiece()];score=0;charges=c.tilts;meter=0;combo=0;over=false;revived=false;busy=false;placed=0;tool=null;tut=0;
  boosts={};if(!c.tut)GM.takeBoosters().forEach(id=>boosts[id]=true);
  if(boosts.tilts){charges=Math.min(5,charges+2);delete boosts.tilts;GM.toast('🌀 +2 tilts!')}
  boardEl.classList.remove('bombing');app.classList.remove('off');GM.handHide();
  render();renderTray();renderHud();$('#tiltbar').classList.remove('urge');
}
function restart(){start(cfg.mode==='level'?levelCfg(cfg.level):cfg.mode==='daily'?dailyCfg(cfg.seed,cfg.key):endlessCfg())}
function gameOver(){
  over=true;blip(160,.5,'sawtooth',.06);buzz(70);
  setTimeout(()=>{
    const base={title:'Board full!',canRevive:!revived,reviveLabel:'+3 tilts & new pieces',onRevive:revive,onHome:goHome,onRetry:restart};
    if(cfg.mode==='endless'){const nb=GM.best('endless',score);GM.results({...base,label:'Score',score,newBest:nb&&score>0,best:GM.best('endless'),coins:Math.floor(score/40)})}
    else if(cfg.mode==='level')GM.results({...base,label:'Level '+(cfg.level+1)+' · target '+cfg.target,score:score+'/'+cfg.target,coins:Math.floor(score/60),retryLabel:'Retry level'});
    else GM.results({...base,label:'Daily Challenge · target '+cfg.target,score:score+'/'+cfg.target,coins:Math.floor(score/60)});
  },550);
}
function revive(){revived=true;over=false;charges=Math.min(5,charges+3);pieces=[smallPiece(),smallPiece(),smallPiece()];app.classList.remove('off');afterMove();toast('+3 TILTS')}
function win(){
  over=true;GM.ui.win();buzz(50);toast('TARGET!','level complete');
  setTimeout(()=>{
    if(cfg.mode==='level'){
      const st=placed<=cfg.par?3:placed<=Math.round(cfg.par*1.35)?2:1;const newSt=GM.setStars(cfg.level,st);
      GM.results({win:true,title:'Level '+(cfg.level+1)+' complete!',label:'Pieces used (par '+cfg.par+')',score:placed,stars:st,coins:10+Math.floor(cfg.target/80),
        extra:newSt?{label:'New star bonus',amount:newSt*10}:null,retryLabel:'Replay',onRetry:restart,onNext:cfg.level<LEVELS-1?()=>start(levelCfg(cfg.level+1)):null,onHome:goHome});
    }else{
      const rew=GM.dailyComplete(cfg.key);
      GM.results({win:true,title:'Daily Challenge done!',label:'Score',score,coins:Math.floor(score/60),extra:rew?{label:'Daily reward',amount:rew}:null,retryLabel:'Play again',onRetry:restart,onHome:goHome});
    }
  },900);
}
function goHome(){over=true;tut=0;GM.handHide();app.classList.add('off');GM.showHome()}
function openPause(){if(over||busy)return;over=true;GM.handHide();GM.pause({onResume:()=>{over=false;if(tut)tutStep()},onRestart:()=>tut?tutorial():restart(),onHome:goHome})}

/* ---------- tutorial: 1) drag a block into a gap, 2) tilt when stuck, 3) place the big block ---------- */
function tutorial(){
  start({mode:'level',level:0,tilts:3,stones:0,seed:1,tut:true});tut=1;
  grid=empty();for(let c=0;c<6;c++)grid[7][c]=[1,2,3,4,5,6][c];grid[6][0]=5;grid[6][1]=5;grid[5][0]=2;
  pieces=[{shape:shapeOf('XX'),color:3},null,null];
  render();renderTray();renderHud();setTimeout(tutStep,300);
}
function tutStep(){
  if(!tut)return;
  if(tut===1){
    if(!pieces[0]){tut=2;
      // scattered blocks: every 3×3 spot is blocked until the board is tilted left
      grid=empty();[[0,1],[1,4],[2,7],[3,2],[4,5],[5,0],[6,3],[7,6],[0,6],[3,7],[6,0],[5,4]].forEach(([r,c],i)=>grid[r][c]=1+i%6);
      pieces=[{shape:shapeOf('XXX|XXX|XXX'),color:6},null,null];charges=Math.max(charges,1);render();renderTray();renderHud();
      setTimeout(tutStep,500);return}
    const s=trayEl.children[0].getBoundingClientRect(),a=cellCenter(7,6),b=cellCenter(7,7);
    GM.hand({mode:'drag',x:s.left+s.width/2,y:s.top+s.height/2,x2:(a.x+b.x)/2,y2:a.y,text:'<b>Drag</b> the block into the gap to fill the bottom row. Full rows and columns clear!',tipAt:'top'});return;
  }
  if(tut===2){
    if(!canFitAnywhere(pieces[0].shape)){const ar=document.querySelector('.arrow[data-d="L"]').getBoundingClientRect();
      GM.hand({mode:'tap',x:ar.left+ar.width/2,y:ar.top+ar.height/2,text:'No room for this block? <b>TILT</b> the board! Tap ◀ or swipe the board left. Everything slides to that wall.',tipAt:'top'});return}
    tut=3;
  }
  if(tut===3){
    if(!pieces[0]){tut=0;GM.handHide();GM.tutorialDone();over=true;
      setTimeout(()=>GM.results({title:"You're ready!",label:'Tutorial complete',score:'★',coins:20,retryLabel:'Play Level 1',onRetry:()=>start(levelCfg(0)),onHome:goHome}),500);return}
    const s=trayEl.children[0].getBoundingClientRect();let spot=null;
    for(let r=0;r<=5&&!spot;r++)for(let c=5;c>=0&&!spot;c--)if(fits(pieces[0].shape,r,c))spot=[r,c];
    const a=cellCenter(spot[0]+1,spot[1]+1);
    GM.hand({mode:'drag',x:s.left+s.width/2,y:s.top+s.height/2,x2:a.x,y2:a.y,text:'Now there\'s room. Drag it in! Tilts are limited: you earn one for every 3 lines you clear.',tipAt:'top'});
  }
}

/* ---------- intro logo animation: blocks slide when the board tilts, a row clears, then the title drops in ---------- */
const IC=['#ff5d5d','#ffa21f','#ffd23f','#2fd38a','#36c5ff','#c77dff'];
function introDraw(g,w,h,p,tt){
  const gr=g.createRadialGradient(w/2,0,10,w/2,h*.4,Math.max(w,h));gr.addColorStop(0,'#2c4ad0');gr.addColorStop(.5,'#1a33a6');gr.addColorStop(1,'#0f2170');g.fillStyle=gr;g.fillRect(0,0,w,h);
  const S=Math.min(w*.62,280),cs=S/5,x0=w/2,y0=h*.42;
  const tiltA=p<.15?0:p<.3?Math.sin((p-.15)/.15*Math.PI/2)*-.22:p<.42?-.22*(1-(p-.3)/.12):0;
  g.save();g.translate(x0,y0);g.rotate(tiltA);
  g.fillStyle='#12287c';rr(g,-S/2-8,-S/2-8,S+16,S+16,18);g.fill();g.strokeStyle='#3152d8';g.lineWidth=3;g.stroke();
  const blocks=[[0,1,0],[0,3,1],[1,2,2],[2,0,3],[2,4,4],[3,1,5],[4,0,0],[4,2,1],[4,4,2],[4,1,3],[4,3,4]];
  const slide=Math.min(1,Math.max(0,(p-.18)/.14));const clear=p>.42&&p<.55;
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){g.fillStyle='#2340b8';rr(g,-S/2+c*cs+2,-S/2+r*cs+2,cs-4,cs-4,6);g.fill()}
  const rowsCount={};blocks.forEach(([r,c,k])=>{rowsCount[r]=(rowsCount[r]||0)});
  const order={};blocks.forEach(b=>{order[b[0]]=(order[b[0]]||[]);order[b[0]].push(b)});
  for(const r in order){order[r].sort((a,b)=>a[1]-b[1]).forEach((b,i)=>{const [rr0,c0,k]=b;const cx=c0+(i-c0)*slide;
    if(+r===4&&p>.42){if(p>.55)return;const s=1+Math.sin((p-.42)/.13*Math.PI)*.2;g.save();g.translate(-S/2+cx*cs+cs/2,-S/2+rr0*cs+cs/2);g.scale(s*(1-(p-.42)/.13),s*(1-(p-.42)/.13));g.fillStyle='#fff';rr(g,-cs/2+2,-cs/2+2,cs-4,cs-4,6);g.fill();g.restore();return}
    g.fillStyle=IC[k];rr(g,-S/2+cx*cs+2,-S/2+rr0*cs+2,cs-4,cs-4,6);g.fill();g.fillStyle='rgba(0,0,0,.24)';g.fillRect(-S/2+cx*cs+4,-S/2+rr0*cs+cs-8,cs-8,4)})}
  g.restore();
  const tp=Math.min(1,Math.max(0,(p-.55)/.3));
  if(tp>0){const L='TILTRIX';const fs=Math.min(w*.16,78);g.font='400 '+Math.round(fs)+'px "Lilita One",sans-serif';g.textAlign='center';g.textBaseline='middle';
    const tw=g.measureText(L).width;let x=w/2-tw/2;for(let i=0;i<L.length;i++){const ch=L[i],cw=g.measureText(ch).width;const d=Math.min(1,Math.max(0,tp*1.6-i*.1));const yy=h*.8-(1-easeOut(d))*h*.3;
      g.globalAlpha=d;g.fillStyle='#0f2170';g.fillText(ch,x+cw/2,yy+5);g.fillStyle=IC[i%6];g.fillText(ch,x+cw/2,yy);x+=cw}g.globalAlpha=1}
  if(p>.9){g.fillStyle='rgba(7,6,15,'+((p-.9)/.1)+')';g.fillRect(0,0,w,h)}
}
function easeOut(x){return 1-Math.pow(1-x,3)}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- input ---------- */
document.querySelectorAll('.arrow').forEach(b=>b.addEventListener('click',()=>tilt(b.dataset.d)));
let sw=null;
boardEl.addEventListener('pointerdown',e=>{
  if(tool==='bomb'&&!busy&&!over){const g=geom();const c=Math.floor((e.clientX-g.left)/g.pitch),r=Math.floor((e.clientY-g.top)/g.pitch);if(r>=0&&c>=0&&r<N&&c<N)bombAt(r,c);return}
  if(!drag)sw={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.max(Math.abs(dx),Math.abs(dy))<36)return;tilt(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
addEventListener('keydown',e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];if(m&&GM.mode==='game'){e.preventDefault();tilt(m)}else if(e.key==='Escape')openPause()});
$('#pauseBtn').addEventListener('click',openPause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!over&&GM.mode==='game')openPause()});

/* ---------- Golden Mayhem kit setup ---------- */
grid=empty();pieces=[null,null,null];score=0;charges=3;meter=0;
const demo=()=>{const k=[1,0,3,0, 0,2,0,5, 4,6,2,1, 0,0,6,0];return'<div class="tx-demo">'+k.map(v=>v?`<i class="f k${v}"></i>`:'<i></i>').join('')+'</div>'};
GM.init({
  id:'tiltrix',name:'Tiltrix Mayhem',version:'1.0',
  privacyUrl:'https://claude.ai/artifact/BtsacaNjCdAye3sSyrmK4C',
  currency:{icon:'●',name:'Coins'},
  titleHtml:'<div class="tx-title"><img src="img/logo.webp" alt="Tiltrix Mayhem" style="display:block;margin:0 auto 6px;width:84%;max-width:360px">'+demo()+'<div class="tx-sub" id="txBest"></div></div>',
  playLabel:'Classic',
  music:{root:262,bpm:100,prog:[[0,4,7],[-3,0,4],[5,9,12],[7,11,14]],pattern:[0,1,2,1,2,1,0,2],wave:'triangle'},
  intro:{draw:introDraw},
  onHome(){app.classList.add('off');const b=GM.best('endless');$('#txBest').innerHTML=b?'BEST <b>'+b+'</b>':'DROP · CLEAR · TILT'},
  onPlay(){start(endlessCfg())},
  onBack(){openPause()},
  levels:{count:LEVELS,play:i=>start(levelCfg(i)),hint:'Reach the target score. Use fewer pieces for more stars: ★★★ at or under par.'},
  daily:{goal:'Today\'s board: reach <b>700 points</b>, starting with <b>10 stone blocks</b> and only <b>2 tilts</b>.',play:(seed,key)=>start(dailyCfg(seed,key))},
  shop:{skinsTitle:'Blocks',skins:SKINS.map(s=>({id:s.id,name:s.name,cost:s.cost,
    icon:s.img?`<span style="display:grid;grid-template-columns:repeat(2,20px);gap:3px">${[1,2,3,4].map(n=>`<img src="img/sk/${s.img}_${n}.webp" width=20 height=20>`).join('')}</span>`:`<span style="display:grid;grid-template-columns:repeat(2,20px);gap:3px">${s.cols.map(c=>`<i style="width:20px;height:20px;border-radius:${s.r};${s.neon?`box-shadow:inset 0 0 0 3px ${c},0 0 8px ${c};background:#0d1a5c`:s.gem?`background:linear-gradient(135deg,rgba(255,255,255,.75) 0 14%,${c} 30% 62%,rgba(0,0,0,.28) 100%),${c}`:`background:${c};box-shadow:inset 0 -3px 0 rgba(0,0,0,.24)`}"></i>`).join('')}</span>`,
    swatch:'background:#12287c'})),boosters:BOOSTERS,onEquip:applySkin},
  tutorial(){tutorial()}
});
applySkin(GM.equipped());window.txApply&&window.txApply();
</script>
