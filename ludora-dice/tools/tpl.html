<title>Ludora Pawn Collection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: phone-width store grid of pawn sets; a sheet plays each pawn's capture */
:root{--bg:#5a3fd0;--bg2:#4a2fb8;--card:#7a5ae8;--card2:#6a48d8;--ink:#fff;--sub:#d9ceff;--rare:#3a8cff;--epic:#b44bff;--leg:#ffb21a;--font-d:"Baloo 2",system-ui,sans-serif;--font-b:Nunito,system-ui,sans-serif;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.06) 30%,transparent 32%);background-size:34px 34px;color:var(--ink);font-family:var(--font-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 30px}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:var(--font-d);font-size:26px;margin:4px 0 0;text-wrap:balance}
.lead{margin:2px 0 12px;color:var(--sub);font-size:14px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bar button{border:2px solid rgba(255,255,255,.35);background:var(--bg2);color:#fff;border-radius:999px;padding:5px 12px;font:800 13px var(--font-b);cursor:pointer}
.bar button[aria-pressed="true"]{background:#ffb21a;color:#3a2000;border-color:#ffe08a}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{border:3px solid rgba(255,255,255,.55);border-radius:16px;background:linear-gradient(var(--card),var(--card2));padding:6px 4px 8px;cursor:pointer;color:#fff;font:inherit;box-shadow:0 4px 0 rgba(20,10,60,.4);display:flex;flex-direction:column;align-items:center;gap:4px}
.card:focus-visible,.bar button:focus-visible,.x:focus-visible,.play:focus-visible{outline:3px solid #ffe08a;outline-offset:2px}
.card b{font:800 14px var(--font-d)}
.set{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;width:86%;aspect-ratio:1.05}
.set img{width:100%;height:100%;object-fit:contain}
.rar{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.r-rare{background:var(--rare)}.r-epic{background:var(--epic)}.r-legendary{background:var(--leg);color:#3a2000}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,4,40,.72);display:grid;place-items:center;z-index:10;padding:16px}
.ov[hidden]{display:none}
.sheet{width:min(380px,100%);background:linear-gradient(#2a1a6a,#140a3a);border:3px solid rgba(255,255,255,.6);border-radius:22px;padding:14px;position:relative;text-align:center}
.sheet h2{font:800 26px var(--font-d);margin:0}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:#e8394a;color:#fff;font-size:20px;cursor:pointer}
.stage{position:relative;height:320px;margin:10px 0;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(140,110,255,.45),transparent 60%),linear-gradient(#3a2a8a,#1a0f4a)}
.strip{position:absolute;left:50%;top:18px;bottom:18px;width:66px;translate:-50% 0;display:flex;flex-direction:column-reverse;gap:6px}
.strip i{flex:1;border-radius:10px;background:linear-gradient(#ffffff,#dfe4f0);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.pc{position:absolute;left:50%;width:58px;height:58px;translate:-50% 0;transition:bottom .32s cubic-bezier(.3,1.5,.5,1);z-index:3}
.pc img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.pc.hop img{animation:hop .32s ease-out}
@keyframes hop{50%{transform:translateY(-16px) scale(1.06,.94)}}
.vic{z-index:2;transition:transform .9s ease-in,opacity .9s}
.vic.gone{transform:translate(170px,-160px) rotate(560deg);opacity:0}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx *{position:absolute;font-style:normal;line-height:1;translate:-50% -50%}
.word{left:50%;top:22%;font:900 30px/1 var(--font-d);color:#fff;-webkit-text-stroke:2px #2a1050;text-shadow:0 3px 0 #2a1050;white-space:nowrap;animation:word 1.5s ease-out forwards}
@keyframes word{0%{transform:scale(0) rotate(-10deg)}20%{transform:scale(1.25) rotate(4deg)}35%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.pt{font-size:28px;animation:pt 1.1s ease-out forwards}
@keyframes pt{0%{transform:scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot,200deg)) scale(1.1);opacity:0}}
.hero{width:110px;height:110px;z-index:6;animation:hero 1.5s cubic-bezier(.3,1.5,.5,1) forwards}
.hero img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
@keyframes hero{0%{transform:translateX(-120px) scale(.3) rotate(-25deg);opacity:0}25%{transform:translateY(0) scale(1.15) rotate(6deg);opacity:1}40%{transform:scale(1) rotate(-4deg)}75%{opacity:1}100%{transform:translateY(-60px) scale(.6);opacity:0}}
.ring{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 70%);animation:ring 1s ease-out forwards}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(5);opacity:0}}
.skull{font-size:52px;opacity:0;animation:skull 1.3s ease-out forwards}
@keyframes skull{0%{transform:scale(0);opacity:0}25%{transform:scale(1.35) rotate(-10deg);opacity:1}40%{transform:scale(1) rotate(8deg)}55%{transform:rotate(-6deg)}75%{opacity:1}100%{transform:translateY(-30px) scale(.8);opacity:0}}
.bone{font-size:26px;opacity:0;animation:bone 1s ease-in forwards}
@keyframes bone{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),110px) rotate(var(--rot));opacity:0}}
.big{font-size:90px;animation:slam .9s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes slam{0%{transform:translateY(-200px) rotate(-30deg);opacity:0}15%{opacity:1}55%{transform:translateY(0) rotate(10deg) scale(1.1)}70%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.beam{width:80px;height:260px;background:linear-gradient(rgba(180,255,240,.0),rgba(180,255,240,.75));clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);translate:-50% -100%!important;animation:beam 1.2s ease-out forwards}
@keyframes beam{0%{opacity:0}20%,70%{opacity:1}100%{opacity:0}}
.bolt{font-size:70px;animation:bolt .9s steps(2) forwards}
@keyframes bolt{0%,40%,80%{opacity:1;transform:scale(1.2)}20%,60%,100%{opacity:0;transform:scale(.8)}}
.flame{font-size:46px;animation:flame 1.2s ease-out forwards}
@keyframes flame{0%{transform:translateY(20px) scale(.3);opacity:0}30%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{transform:translateY(-70px) scale(.6);opacity:0}}
.ice{width:76px;height:76px;border-radius:12px;background:linear-gradient(135deg,rgba(220,250,255,.9),rgba(120,200,255,.6));border:3px solid #fff;animation:ice 1.2s ease-out forwards}
@keyframes ice{0%{transform:scale(0)}25%{transform:scale(1.1)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.web{font-size:96px;animation:web 1.3s ease-out forwards}
@keyframes web{0%{transform:scale(0) rotate(-90deg)}30%{transform:scale(1.1) rotate(0)}85%{opacity:1}100%{opacity:0}}
.rbw{width:220px;height:110px;border-radius:110px 110px 0 0;background:conic-gradient(from 270deg at 50% 100%,#ff5a5a,#ffd24a,#6cf28a,#4cc9ff,#b06bff,#ff5a5a 180deg,transparent 0);-webkit-mask:radial-gradient(circle at 50% 100%,transparent 55px,#000 56px);mask:radial-gradient(circle at 50% 100%,transparent 55px,#000 56px);translate:-50% -100%!important;animation:beam 1.4s ease-out forwards}
.jaw{font-size:110px;animation:jaw 1s ease-in-out forwards}
@keyframes jaw{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.2);opacity:1}45%{transform:scale(.9)}60%{transform:scale(1.15)}85%{opacity:1}100%{opacity:0}}
.play{border:0;border-radius:14px;background:linear-gradient(#5be86a,#1e9e34);color:#fff;font:800 18px var(--font-d);padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 #136b22}
.desc{color:var(--sub);font-size:14px;margin:6px 0 10px}
@media (prefers-reduced-motion:reduce){.fx *{animation-duration:.01s!important}}
</style>
<div class="wrap">
  <h1>Ludora pawns, redesigned</h1>
  <p class="lead">Preview only. Each set comes in red, green, yellow and blue. Tap a pawn to watch it bump a rival.</p>
  <div class="bar" id="bar"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="ov" id="ov" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
  <button class="x" id="x" aria-label="Close">✕</button>
  <h2 id="t"></h2><span class="rar" id="rr"></span>
  <div class="stage" id="st"><div class="strip"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="pc vic" id="vic"><img alt="Rival pawn" src="victim.webp"></div>
    <div class="pc" id="me"><img alt="" id="meimg"></div><div class="fx" id="fx"></div></div>
  <p class="desc" id="ds"></p>
  <button class="play" id="pl">▶ Play again</button>
</div></div>
<script>
var D=__DATA__;
var COLS=['yellow','green','blue','red'],flt='all';
var CC={fire:'#ff6a1a',rainbow:'#ff7ad9',zap:'#ffe24a',beam:'#b4fff0',royal:'#ffd84d',chomp:'#4dc8ff',ink:'#6a3aff',spook:'#d6d0ff',roar:'#ffb02a',swipe:'#ffffff',meteor:'#ffb02a',blast:'#ff9a2a',freeze:'#bff0ff',splash:'#5ad0ff',web:'#ffffff',sting:'#ffd24a',swirl:'#ffc4f0',slam:'#ffffff',burst:'#ffffff',snip:'#ff7a5a'};
var DESC={rare:'Rare pawn: its own bump effect.',epic:'Epic pawn: the character jumps out for a big bump, then a skull and bones.',legendary:'Legendary pawn: the biggest show, with the character, a full effect and a skull and bones.'};
function img(id,c){return 'p/'+id+'_'+c+'.webp';}
var bar=document.getElementById('bar');
[['all','All '+D.length],['rare','Rare'],['epic','Epic'],['legendary','Legendary']].forEach(function(f){var b=document.createElement('button');b.type='button';b.textContent=f[1];b.dataset.f=f[0];b.setAttribute('aria-pressed',String(f[0]==='all'));b.onclick=function(){flt=f[0];[].forEach.call(bar.children,function(x){x.setAttribute('aria-pressed',String(x.dataset.f===flt));});draw();};bar.appendChild(b);});
function draw(){var g=document.getElementById('grid');g.innerHTML='';
  D.filter(function(p){return flt==='all'||p.r===flt;}).forEach(function(p){
    var c=document.createElement('button');c.type='button';c.className='card';
    c.innerHTML='<b>'+p.n+'</b><div class="set">'+COLS.map(function(k){return '<img alt="" loading="lazy" src="'+img(p.id,k)+'">';}).join('')+'</div><span class="rar r-'+p.r+'">'+p.r+'</span>';
    c.onclick=function(){open(p);};g.appendChild(c);});}
draw();
var cur=null,T=[];
function clearT(){T.forEach(clearTimeout);T=[];}
function later(f,ms){T.push(setTimeout(f,ms));}
function open(p){cur=p;document.getElementById('t').textContent=p.n;var rr=document.getElementById('rr');rr.textContent=p.r;rr.className='rar r-'+p.r;
  document.getElementById('ds').textContent=DESC[p.r];document.getElementById('meimg').src=img(p.id,'blue');
  document.getElementById('ov').hidden=false;run();}
document.getElementById('x').onclick=function(){clearT();document.getElementById('ov').hidden=true;};
document.getElementById('pl').onclick=run;
function sq(n){return 18+n*((320-36)/5);}
function add(cls,html,x,y,style){var e=document.createElement('b');e.className=cls;if(html)e.innerHTML=html;e.style.left=x+'px';e.style.top=y+'px';if(style)e.setAttribute('style',e.getAttribute('style')+';'+style);document.getElementById('fx').appendChild(e);return e;}
function run(){
  clearT();var p=cur,fx=document.getElementById('fx');fx.innerHTML='';
  var me=document.getElementById('me'),vic=document.getElementById('vic'),st=document.getElementById('st');
  vic.classList.remove('gone');vic.style.opacity='1';vic.style.bottom=sq(2)+'px';me.style.bottom=sq(0)+'px';
  var W=st.clientWidth,cx=W/2,vy=320-sq(2)-30,col=CC[p.k]||'#fff';
  for(var s=1;s<=2;s++)(function(s){later(function(){me.style.bottom=sq(s)+'px';me.classList.remove('hop');void me.offsetWidth;me.classList.add('hop');},s*380);})(s);
  later(function(){
    add('ring','',cx,vy,'--c:'+col);
    var w=add('word','',cx,26);w.textContent=p.w;
    var k=p.k,big=p.r!=='rare';
    if(k==='fire'){for(var i=0;i<8;i++)later(function(){add('flame','🔥',cx+(Math.random()-.5)*70,vy+10);},i*70);vic.style.filter='brightness(.2) sepia(1)';later(function(){vic.style.filter='';},1300);}
    else if(k==='beam'){add('beam','',cx,vy+30);later(function(){vic.style.transition='bottom .8s ease-in,opacity .8s';vic.style.bottom=(sq(2)+120)+'px';vic.style.opacity='0';},300);later(function(){vic.style.transition='';},1300);}
    else if(k==='zap'){add('bolt','⚡',cx-26,vy-30);add('bolt','⚡',cx+26,vy-40);vic.style.filter='brightness(2.5)';later(function(){vic.style.filter='';},500);}
    else if(k==='freeze'){add('ice','',cx,vy);}
    else if(k==='web'){add('web','🕸️',cx,vy);}
    else if(k==='rainbow'){add('rbw','',cx,vy+40);}
    else if(k==='chomp'){add('jaw','🦈',cx,vy);}
    else if(k==='ink'){for(var j=0;j<6;j++)add('pt','⚫',cx,vy,'--dx:'+((Math.random()-.5)*90).toFixed(0)+'px;--dy:'+((Math.random()-.5)*70).toFixed(0)+'px;font-size:40px;animation-duration:1.5s');}
    else if(k==='slam'||k==='royal'||k==='meteor'||k==='snip'||k==='sting'){add('big',k==='meteor'?'☄️':(k==='snip'?'✂️':(k==='sting'?'🐝':p.p[0])),cx,vy);}
    else if(k==='spook'){add('jaw','👻',cx,vy);}
    else if(k==='roar'||k==='swipe'){add('jaw',k==='roar'?'💢':'🐾',cx,vy);}
    for(var n=0;n<(big?16:10);n++){var a=n/(big?16:10)*Math.PI*2,d=70+Math.random()*50;add('pt',p.p[n%p.p.length],cx,vy,'--dx:'+(Math.cos(a)*d).toFixed(0)+'px;--dy:'+(Math.sin(a)*d*.8).toFixed(0)+'px;animation-delay:'+(.1+Math.random()*.2).toFixed(2)+'s');}
    if(big){add('hero','<img alt="" src="'+img(p.id,'blue')+'">',cx-88,vy+30);}
    later(function(){add('skull','💀',cx,vy);for(var b=0;b<(big?4:2);b++)add('bone','🦴',cx,vy,'--dx:'+((b-1.5)*50)+'px;--rot:'+(b%2?280:-280)+'deg;animation-delay:.25s');
      vic.classList.add('gone');},big?550:300);
  },900);
}
</script>
